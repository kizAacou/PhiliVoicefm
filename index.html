<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHILiVoice FM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8c6;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        header img {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: #f39c12;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        button {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1em;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e67e22;
        }
        audio {
            margin-top: 20px;
            width: 300px;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://via.placeholder.com/150" alt="PHILiVoice FM Logo">
    </header>
    <h1>Murakaza neza kuri PHILiVoice FM!</h1>
    <p>Twumva muzajya mwumva umuziki, amakuru, n’ibiganiro bishimishije buri munsi.</p>
    
    <button onclick="playRadio()">Play Radio</button>
    <audio id="radioPlayer" controls>
        <source src="https://example.com/stream.mp3" type="audio/mpeg">
        Browser yawe ntiyashyigikira radio.
    </audio>

    <script>
        const radio = document.getElementById('radioPlayer');
        radio.style.display = 'none'; // ntibigaragare mbere yo gukanda Play

        function playRadio() {
            radio.style.display = 'block'; // igaragare
            radio.play();
        }
    </script>
</body>
</html>
